nt-family="Arial" font-size="17" font-weight="bold" fill="#183044">P0 · PWM</text><text x="971" y="457" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">R (solo 3 canales)</text><rect x="48" y="486" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="486" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 508 C450 508 545 508 640 508 S840 508 956 508" fill="none" stroke="#139e8a" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="508" r="9" fill="#139e8a"/><circle cx="958" cy="508" r="9" fill="#139e8a"/><text x="63" y="514" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">P1 · PWM</text><text x="971" y="514" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">G (solo 3 canales)</text><rect x="48" y="543" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="543" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 565 C450 565 545 565 640 565 S840 565 956 565" fill="none" stroke="#d85564" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="565" r="9" fill="#d85564"/><circle cx="958" cy="565" r="9" fill="#d85564"/><text x="63" y="571" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">P2 · PWM</text><text x="971" y="571" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">B (solo 3 canales)</text><rect x="48" y="600" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="600" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 622 C450 622 545 622 640 622 S840 622 956 622" fill="none" stroke="#426b99" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="622" r="9" fill="#426b99"/><circle cx="958" cy="622" r="9" fill="#426b99"/><text x="63" y="628" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">alimentación compatible</text><text x="971" y="628" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">VCC / GND</text><rect x="48" y="657" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="657" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 679 C450 679 545 679 640 679 S840 679 956 679" fill="none" stroke="#8749b6" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="679" r="9" fill="#8749b6"/><circle cx="958" cy="679" r="9" fill="#8749b6"/><text x="63" y="685" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">S→P1, V→V, G→G</text><text x="971" y="685" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">Si el módulo tiene S/V/G</text><rect x="42" y="755" width="1196" height="80" rx="12" fill="#fff4df" stroke="#f0cf85"/><text x="62" y="782" font-family="Arial" font-size="18" fill="#865c14" font-weight="bold">⚠ ATENCIÓN</text><text x="62" y="803" font-family="Arial" font-size="15" fill="#554d39">El código de las actividades solo sirve para RGB de tres canales separados PWM y con control de corriente. Si el módulo real</text><text x="62" y="821" font-family="Arial" font-size="15" fill="#554d39">tiene tres pines S/V/G, NO sigas ese código: identifica su circuito y extensión antes de conectar.</text><text x="44" y="885" font-family="Arial" font-size="13" fill="#617877">Imagen del componente procedente del inventario facilitado · Comprobar tensión y orden de contactos en la placa real.</text></svg>