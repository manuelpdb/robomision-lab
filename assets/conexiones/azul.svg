"17" font-weight="bold" fill="#183044">P1 · salida</text><text x="971" y="457" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">S</text><rect x="48" y="486" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="486" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 508 C450 508 545 508 640 508 S840 508 956 508" fill="none" stroke="#139e8a" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="508" r="9" fill="#139e8a"/><circle cx="958" cy="508" r="9" fill="#139e8a"/><text x="63" y="514" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">3,3 V</text><text x="971" y="514" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">V</text><rect x="48" y="543" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="543" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 565 C450 565 545 565 640 565 S840 565 956 565" fill="none" stroke="#d85564" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="565" r="9" fill="#d85564"/><circle cx="958" cy="565" r="9" fill="#d85564"/><text x="63" y="571" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">GND</text><text x="971" y="571" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">G</text><rect x="42" y="641" width="1196" height="80" rx="12" fill="#fff4df" stroke="#f0cf85"/><text x="62" y="668" font-family="Arial" font-size="18" fill="#865c14" font-weight="bold">⚠ ATENCIÓN</text><text x="62" y="689" font-family="Arial" font-size="15" fill="#554d39">No conectes un LED desnudo sin resistencia limitadora; el módulo suele incorporar componentes de protección, pero verifícalo.</text><text x="44" y="771" font-family="Arial" font-size="13" fill="#617877">Imagen del componente procedente del inventario facilitado · Comprobar tensión y orden de contactos en la placa real.</text></svg>