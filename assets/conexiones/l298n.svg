t-weight="bold" fill="#183044">ENB</text><rect x="48" y="657" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="657" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 679 C450 679 545 679 640 679 S840 679 956 679" fill="none" stroke="#8749b6" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="679" r="9" fill="#8749b6"/><circle cx="958" cy="679" r="9" fill="#8749b6"/><text x="63" y="685" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">G común</text><text x="971" y="685" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">GND</text><rect x="48" y="714" width="270" height="45" rx="10" fill="white" stroke="#d9e6e1"/><rect x="958" y="714" width="276" height="45" rx="10" fill="white" stroke="#d9e6e1"/><path d="M319 736 C450 736 545 736 640 736 S840 736 956 736" fill="none" stroke="#c77c33" stroke-width="7" stroke-linecap="round"/><circle cx="319" cy="736" r="9" fill="#c77c33"/><circle cx="958" cy="736" r="9" fill="#c77c33"/><text x="63" y="742" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">fuente CC / motores</text><text x="971" y="742" font-family="Arial" font-size="17" font-weight="bold" fill="#183044">MOTOR V / OUT</text><rect x="42" y="812" width="1196" height="80" rx="12" fill="#fff4df" stroke="#f0cf85"/><text x="62" y="839" font-family="Arial" font-size="18" fill="#865c14" font-weight="bold">⚠ ATENCIÓN</text><text x="62" y="860" font-family="Arial" font-size="15" fill="#554d39">El L298N debe alimentar los motores con fuente externa. Consulta los puentes ENA/ENB y la alimentación lógica real del</text><text x="62" y="878" font-family="Arial" font-size="15" fill="#554d39">módulo; comparte GND con micro:bit, sin enviar 5 V a entradas de la micro:bit.</text><text x="44" y="942" font-family="Arial" font-size="13" fill="#617877">Imagen del componente procedente del inventario facilitado · Comprobar tensión y orden de contactos en la placa real.</text></svg>