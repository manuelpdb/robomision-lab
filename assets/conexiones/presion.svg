" font-size="17" font-weight="bold" fill="#183044">GND</text><rect x="42" y="698" width="1196" height="80" rx="12" fill="#fff4df" stroke="#f0cf85"/><text x="62" y="725" font-family="Arial" font-size="18" fill="#865c14" font-weight="bold">⚠ ATENCIÓN</text><text x="62" y="746" font-family="Arial" font-size="15" fill="#554d39">Verifica que es BMP280, no otro modelo, y que la placa está configurada en I²C. No confundir valores de ejemplo con lecturas</text><text x="62" y="764" font-family="Arial" font-size="15" fill="#554d39">reales.</text><text x="44" y="828" font-family="Arial" font-size="13" fill="#617877">Imagen del componente procedente del inventario facilitado · Comprobar tensión y orden de contactos en la placa real.</text></svg>